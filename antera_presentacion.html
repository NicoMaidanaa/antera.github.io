<style>
    html, body { min-height:100%; height:auto; }
    body { overflow-x:hidden; }
    .back-index {
      position:fixed; left:14px; bottom:14px; z-index:1000;
      display:inline-flex; align-items:center; gap:8px;
      padding:11px 15px; border-radius:999px;
      background:#0F1F3C; color:#fff; text-decoration:none;
      font:600 13px/1.2 Inter,system-ui,sans-serif;
      box-shadow:0 8px 24px rgba(15,31,60,.22);
      border:1px solid rgba(255,255,255,.22);
    }
    .back-index:hover { background:#1F7C7B; }
    #root main { min-height:0; }
    #root main > div { padding-top:20px; padding-bottom:100px; }
    #root main > div > div { height:auto; }
    #root main > div > div > div:first-child { height:auto; min-height:640px; }
    #root main > div > div > div:first-child > div:first-child { height:auto; min-height:640px; }
    #root main button { max-width:100%; }
    @media (max-width:700px) {
      .back-index { left:10px; bottom:10px; padding:10px 13px; font-size:12px; }
      #root header > div { padding-left:14px; padding-right:14px; }
      #root main > div { padding:12px 10px 88px; }
      #root main > div > div { border-radius:18px; }
      #root main > div > div > div:first-child,
      #root main > div > div > div:first-child > div:first-child {
        min-height:0; height:auto;
      }
      #root main [class*="p-7"], #root main [class*="p-8"] { padding:18px; }
      #root main [class*="text-[64px]"] { font-size:clamp(34px,10vw,48px); }
      #root main [class*="text-[36px]"] { font-size:clamp(27px,7vw,36px); }
      #root main [class*="text-[30px]"] { font-size:clamp(24px,6vw,30px); }
      #root main [class*="text-[28px]"] { font-size:clamp(23px,6vw,28px); }
      #root main [class*="grid-cols-4"],
      #root main [class*="grid-cols-3"],
      #root main [class*="grid-cols-2"] { grid-template-columns:minmax(0,1fr); }
      #root main [class*="w-[600px]"], #root main [class*="w-[640px]"],
      #root main [class*="w-[520px]"], #root main [class*="w-[500px]"],
      #root main [class*="w-[400px]"] { width:100%; max-width:100%; }
      #root main [class*="h-[600px]"], #root main [class*="h-[640px]"],
      #root main [class*="h-[520px]"], #root main [class*="h-[500px]"],
      #root main [class*="h-[400px]"] { height:auto; min-height:0; }
      #root main [class*="overflow-hidden"] { overflow:visible; }
      #root main [class*="gap-8"] { gap:18px; }
      #root main [class*="mt-10"] { margin-top:20px; }
      #root main [class*="text-center"] { overflow-wrap:anywhere; }
    }
  </style>
